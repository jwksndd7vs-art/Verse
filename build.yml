name: Build Verse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone app
        run: |
          xcodebuild \
            -project VerseWidget/VerseWidget.xcodeproj \
            -scheme Verse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Preserve shared storage permissions for AltStore
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-iphoneos/Verse.app"
          widget="$app/PlugIns/VerseLyrics.appex"
          /usr/bin/codesign --force --sign - --timestamp=none \
            --entitlements VerseWidget/Widget/Verse.entitlements "$widget"
          /usr/bin/codesign --force --sign - --timestamp=none \
            --entitlements VerseWidget/App/Verse.entitlements "$app"
          /usr/bin/codesign --verify --deep --strict "$app"
          /usr/bin/codesign -d --entitlements :- "$app"
          /usr/bin/codesign -d --entitlements :- "$widget"
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Verse.app Payload/
          /usr/bin/zip -qry Verse-altstore.ipa Payload
      - name: Save download
        uses: actions/upload-artifact@v4
        with:
          name: Verse-altstore
          path: Verse-altstore.ipa
          if-no-files-found: error
